name: Deploy demo to GitHub Pages

# Builds the browser-only demo (anonymised data, no backend) and publishes it to
# GitHub Pages. Note: GitHub Pages on a PRIVATE repo requires a paid plan; if the
# deploy step fails with a Pages entitlement error, either make the repo public
# (the demo carries no personal data) or host the built dist/ elsewhere.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web deps
        working-directory: apps/web
        # Drop the lockfile so npm resolves the platform-specific optional deps
        # (rollup's linux binary) fresh on the CI runner — works around npm/cli#4828.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Build demo
        working-directory: apps/web
        env:
          VITE_BASE: /uct-academic-support/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
